# Plan: CCR Token Stripping from Tool Call Parameters

## Problem
Headroom proxy compresses tool results and injects `<<ccr:HASH...>>` tokens. LLM passes these tokens forward in tool_use input parameters. MCP servers (like memory.remember) persist them — storing session-scoped pointers that expire, causing data loss.

## Solution
Strip CCR tokens from outbound tool_use input parameters in the headroom proxy's streaming handler before forwarding to client.

## Current State (what exists)
- `contracts/ccr_strip.contract.py` — CL12 contract (5 artifacts, compliant)
- `tests/test_ccr_strip_contract.py` — 41 contract verification tests (all pass)
- `headroom/proxy/handlers/streaming.py` — `_strip_ccr_from_value()` + tool_use integration
- `requirements/REQUIREMENT_MANIFEST_CCR_STRIP.md` — requirements manifest

